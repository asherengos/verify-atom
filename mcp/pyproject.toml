[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verify-atom-mcp"
version = "0.2.0"
description = "MCP server giving AI agents cryptographically signed proof of web observations (Ed25519-signed proof packets)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Asher AI Studios" }]
keywords = ["mcp", "model-context-protocol", "verification", "proof", "ed25519"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/asherengos/verify-atom"
Repository = "https://github.com/asherengos/verify-atom"

[project.scripts]
verify-atom-mcp = "mcp_server:main"
verify-atom-mcp-http = "mcp_http_server:main"

[tool.setuptools]
py-modules = ["mcp_server", "mcp_http_server"]
license-files = ["LICENSE"]
